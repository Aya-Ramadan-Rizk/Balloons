<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloons</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="parent">
        <div class="sky-moon">
            <div class="moon"></div><!-- /moon -->
            <div class="star-start star star-1"></div><!-- /star-1 -->
            <div class="star-end star star-2"></div><!-- /star-2 -->
            <div class="star-start star star-3"></div><!-- /star-3 -->
            <div class="star-end star star-4"></div><!-- /star-4 -->
            <div class="star-start star star-5"></div><!-- /star-5 -->
            <div class="star-end star star-6"></div><!-- /star-6 -->
            <div class="star-start star star-7"></div><!-- /star-7 -->
            <div class="star-end star star-8"></div><!-- /star-8 -->
            <div class="star-start star star-9"></div><!-- /star-9 -->
            <div class="star-end star star-10"></div><!-- /star-10 -->
        </div><!-- /sky-moon -->
    
    
        <div class="sky-sun">
            <div class="sun"></div><!-- /sun -->
            <div class="cloud-start cloud cloud-1"></div><!-- /cloud-1 -->
            <div class="cloud-end cloud cloud-2"></div><!-- /cloud-2 -->
            <div class="cloud-start cloud cloud-3"></div><!-- /cloud-3 -->
            <div class="cloud-end cloud cloud-4"></div><!-- /cloud-4 -->
            <div class="cloud-start cloud cloud-5"></div><!-- /cloud-5 -->
            <div class="cloud-end cloud cloud-6"></div><!-- /cloud-6 -->
            <div class="cloud-start cloud cloud-7"></div><!-- /cloud-7 -->
            <div class="cloud-end cloud cloud-8"></div><!-- /cloud-8 -->
            <div class="cloud-start cloud cloud-9"></div><!-- /cloud-9 -->
            <div class="cloud-end cloud cloud-10"></div><!-- /cloud-10 -->
            <div class="cloud-end cloud cloud-11"></div><!-- /cloud-11 -->
            <div class="cloud-end cloud cloud-12"></div><!-- /cloud-12 -->
            <div class="cloud-end cloud cloud-13"></div><!-- /cloud-13 -->
        </div><!-- /sky-sun -->
    </div><!-- /parent -->
    
    <div class="all-Balloons Balloons"></div><!-- /Balloons -->
    <div class="all-Balloons Balloon-1"></div><!-- /Balloon-1 -->
    <div class="all-Balloons Balloon-2"></div><!-- /Balloon-2 -->
    <div class="all-Balloons Balloon-3"></div><!-- /Balloon-3 -->
    <div class="all-Balloons Balloon-4"></div><!-- /Balloon-4 -->
    <div class="all-Balloons Balloon-5"></div><!-- /Balloon-5 -->
    <div class="all-Balloons plus"></div><!-- /plus -->
    <div class="all-Balloons equals"></div><!-- /equals -->
    <div class="all-Balloons number-2"></div><!-- /number-2 -->
    <div class="all-Balloons number-3"></div><!-- /number-3 -->
    <div class="all-Balloons number-4"></div><!-- /number-4 -->
    <div class="all-Balloons number-5"></div><!-- /number-5 -->

</body>
</html>
